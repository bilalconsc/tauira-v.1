baseURL = "https://bibymaths.github.io/tauira/"
title = "Tauira"
theme = "amethyst"

[params]
  # Amethyst-specific display settings
  description = "Capturing entanglements of an educator-researcher experience."
  author = "Your Name"

  # Graph settings (used by Amethyst's built-in force graph)
  enableGraph = true

  # Search
  enableSearch = true

  # Show backlinks panel on every page
  enableBacklinks = true

[taxonomies]
  tag = "tags"
  assemblage = "assemblages"

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON output needed for graph export + search index
