<section class="graph-embed">
  <h2>Rhizomatic Map</h2>
  <div id="tauira-graph" style="width: 100%; height: 400px; border: 1px solid #ddd; border-radius: 4px;"></div>
  <script>
    (function() {
      var container = document.getElementById('tauira-graph');
      if (!container) return;
      var graphDataPath = '{{ site.Params.graphDataPath | default "/graph/tauira-graph.json" }}';
      var script = document.createElement('script');
      script.src = '{{ "js/rhizome.js" | relURL }}';
      script.onload = function() {
        if (typeof initTauiraGraph === 'function') {
          initTauiraGraph(container, graphDataPath);
        }
      };
      document.body.appendChild(script);
    })();
  </script>
</section>
