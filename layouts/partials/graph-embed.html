<section class="graph-embed">
  <h2>Rhizomatic Map</h2>

  <div class="tauira-graph-toolbar">
    <label>
      <span>Category</span>
      <select id="tauira-filter-category">
        <option value="">All categories</option>
        <option value="M">Material</option>
        <option value="K">Knowledge</option>
        <option value="I">Instinctual</option>
      </select>
    </label>

    <label>
      <span>Relationship</span>
      <select id="tauira-filter-relationship">
        <option value="">All relationships</option>
        <option value="co-presence">co-presence</option>
        <option value="affect">affect</option>
        <option value="movement">movement</option>
        <option value="discourse">discourse</option>
      </select>
    </label>

    <button id="tauira-filter-reset" type="button">Reset filters</button>
  </div>

  <div class="tauira-graph-layout">
    <div id="tauira-graph" style="width: 100%; height: 560px; border: 1px solid #ddd; border-radius: 8px;"></div>
    <aside id="tauira-graph-details" class="tauira-graph-details"></aside>
  </div>

  {{ $js := resources.Get "js/tauira-sigma.js" | js.Build | resources.Fingerprint }}
  <script src="{{ $js.RelPermalink }}"></script>
  <script>
    (function () {
      var container = document.getElementById("tauira-graph");
      if (!container || typeof initTauiraSigma !== "function") return;
      initTauiraSigma(container, '{{ site.Params.graphDataPath | relURL }}?v={{ now.Unix }}');
    })();
  </script>
</section>
