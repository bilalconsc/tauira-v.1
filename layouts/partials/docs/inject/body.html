{{- if false }}
<script>
(function () {
  /* ── 0. Guard: only run if the graph container exists on this page ── */
  var el = document.getElementById('tauira-graph');
  if (!el) return;

  /* ── 1. MKI colour palette ── */
  var MKI = { M: '#01696f', K: '#5b4fcf', I: '#d19900' };

  /* ── 2. Compact label helper ──
     Extracts a short identifier from the node label.
     Expected ID format: "enc-YYYY-TN-WN-LN" (e.g., "enc-2025-T1-W3-L2").
     If the label has ≥4 dash-segments and index 1 is a 4-digit year,
     show only the last two segments (e.g., "W3-L2").
     Otherwise truncate to MAX_LABEL_CHARS characters.
  */
  var MAX_LABEL_CHARS = 14;
  function compactLabel(label) {
    if (!label) return '';
    var parts = label.split('-');
    if (parts.length >= 4 && /^\d{4}$/.test(parts[1])) {
      return parts.slice(-2).join('-');   // e.g. W3-L2
    }
    return label.length > MAX_LABEL_CHARS ? label.slice(0, MAX_LABEL_CHARS - 1) + '\u2026' : label;
  }

  /* ── 3. Tooltip DOM element (one, reused) ── */
  var tip = document.createElement('div');
  tip.id = 'tauira-tooltip';
  tip.style.cssText = [
    'position:fixed',
    'pointer-events:none',
    'background:var(--body-background,#fff)',
    'border:1px solid #ddd',
    'border-radius:8px',
    'padding:10px 14px',
    'font-size:13px',
    'max-width:240px',
    'box-shadow:0 4px 16px rgba(0,0,0,.12)',
    'z-index:9999',
    'display:none',
    'line-height:1.5'
  ].join(';');
  document.body.appendChild(tip);

  function moveTip(e) {
    var x = (e && (e.original ? e.original.clientX : e.clientX)) || 0;
    var y = (e && (e.original ? e.original.clientY : e.clientY)) || 0;
    var tw = tip.offsetWidth  || 200;
    var th = tip.offsetHeight || 80;
    tip.style.left = (x + 16 + tw > window.innerWidth  ? x - tw - 12 : x + 16) + 'px';
    tip.style.top  = (y + 16 + th > window.innerHeight ? y - th - 8  : y + 16) + 'px';
  }

  /* ── 4. Empty-state renderer ── */
  function showEmpty() {
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-style:italic;font-size:.9rem;color:#888">No encounters published yet. The graph will appear once fieldnotes are added.</div>';
  }

  /* ── 5. Core graph initialiser — called after all CDN libs load ── */
  function initGraph(data) {
    if (!data || !data.nodes || data.nodes.length === 0) { showEmpty(); return; }

    var g = new graphology.Graph({ multi: true });

    data.nodes.forEach(function (n) {
      g.addNode(n.id, {
        label:       compactLabel(n.label),
        fullLabel:   n.label,
        category:    n.category,
        color:       MKI[n.category] || '#999',
        size:        10,
        contentURL:  n.contentURL || null,
        subcategory: n.subcategory || '',
        x: Math.random(),
        y: Math.random()
      });
    });

    data.edges.forEach(function (e) {
      if (g.hasNode(e.source) && g.hasNode(e.target)) {
        g.addEdge(e.source, e.target, {
          weight:           e.weight != null ? e.weight : 0.5,
          relationshipType: e.relationshipType || '',
          color:            '#ccc',
          size:             Math.max(1, (e.weight != null ? e.weight : 0.5) * 3)
        });
      }
    });

    var renderer = new Sigma(g, el, {
      renderEdgeLabels:       false,
      defaultEdgeColor:       '#ccc',
      defaultNodeColor:       '#999',
      labelFont:              'inherit',
      labelSize:              11,
      labelWeight:            '500',
      labelColor:             { color: '#555' },
      allowInvalidContainer:  true
    });

    /* ── Hover tooltip ── */
    renderer.on('enterNode', function (payload) {
      var a   = g.getNodeAttributes(payload.node);
      var col = MKI[a.category] || '#999';

      // Build tooltip using DOM methods to avoid XSS
      while (tip.firstChild) tip.removeChild(tip.firstChild);

      var labelDiv = document.createElement('div');
      labelDiv.style.cssText = 'font-weight:700;color:' + col;
      labelDiv.textContent = a.fullLabel;
      tip.appendChild(labelDiv);

      var badgeRow = document.createElement('div');
      badgeRow.style.marginTop = '3px';
      var badge = document.createElement('span');
      badge.style.cssText = 'background:' + col + ';color:#fff;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600';
      badge.textContent = a.category;
      badgeRow.appendChild(badge);
      if (a.subcategory) {
        var sub = document.createElement('span');
        sub.style.cssText = 'color:#888;margin-left:6px;font-size:12px';
        sub.textContent = a.subcategory;
        badgeRow.appendChild(sub);
      }
      tip.appendChild(badgeRow);

      if (a.contentURL) {
        var linkDiv = document.createElement('div');
        linkDiv.style.marginTop = '6px';
        var linkSpan = document.createElement('span');
        linkSpan.style.cssText = 'color:' + col + ';font-size:12px';
        linkSpan.textContent = 'Click to open \u2192';
        linkDiv.appendChild(linkSpan);
        tip.appendChild(linkDiv);
      }

      tip.style.display = 'block';
      moveTip(payload.event);
      el.style.cursor = 'pointer';
    });

    renderer.on('mousemovebody', function (payload) { moveTip(payload.event); });

    renderer.on('leaveNode', function () {
      tip.style.display = 'none';
      el.style.cursor = 'default';
    });

    /* ── Click navigation ── */
    renderer.on('clickNode', function (payload) {
      var attrs = g.getNodeAttributes(payload.node);
      // Guard: only navigate to safe root-relative or http(s) URLs (blocks javascript: etc.)
      if (attrs.contentURL && /^(https?:\/\/|\/)/.test(attrs.contentURL)) {
        window.location.href = attrs.contentURL;
      }
    });

    /* ── Background click — reset ── */
    renderer.on('clickStage', function () {
      g.nodes().forEach(function (n) { g.setNodeAttribute(n, 'highlighted', false); });
      g.edges().forEach(function (e) { g.setEdgeAttribute(e, 'color', '#ccc'); });
      renderer.refresh();
    });

    /* ── Fullscreen ── */
    var DEFAULT_HEIGHT = '560px';  // matches the inline height on #tauira-graph divs in content files
    var fsBtn = document.getElementById('btn-fullscreen');
    if (fsBtn) {
      fsBtn.addEventListener('click', function () {
        if (!document.fullscreenElement) {
          el.requestFullscreen().catch(function(){});
        } else {
          document.exitFullscreen();
        }
      });
      document.addEventListener('fullscreenchange', function () {
        el.style.height = document.fullscreenElement === el ? '100vh' : DEFAULT_HEIGHT;
        el.style.borderRadius = document.fullscreenElement === el ? '0' : '8px';
        renderer.refresh();
      });
    }
  }

  /* ── 6. Dynamic CDN loader ── */
  var graphURL = '{{ site.Params.graphDataPath | relURL }}?v={{ now.Unix }}';
  var libs = [
    'https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js',
    'https://cdn.jsdelivr.net/npm/sigma@3.0.2/dist/sigma.min.js'
  ];
  var loaded = 0;
  libs.forEach(function (src) {
    var s = document.createElement('script');
    s.src = src;
    s.onerror = function () {
      console.error('[tauira-graph] Failed to load: ' + src);
      showEmpty();
    };
    s.onload = function () {
      if (++loaded === libs.length) {
        fetch(graphURL)
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(function (data) { initGraph(data); })
          .catch(function (err) {
            console.error('[tauira-graph] Fetch error:', err);
            showEmpty();
          });
      }
    };
    document.head.appendChild(s);
  });
})();
</script>
{{- end }}
